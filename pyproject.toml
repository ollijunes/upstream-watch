[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upstream-watch"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
upstream-watch = "upstream_watch.cli:main"

[tool.setuptools.packages.find]
include = ["upstream_watch*"]

[tool.setuptools.data-files]
"share/upstream-watch/launchd" = ["contrib/launchd/*.plist"]
"share/upstream-watch/systemd" = ["contrib/systemd/*.service", "contrib/systemd/*.timer"]
"share/upstream-watch/examples" = ["examples/config.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S603", "S607"]

[tool.pytest.ini_options]
addopts = "-ra"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.17.0"]
